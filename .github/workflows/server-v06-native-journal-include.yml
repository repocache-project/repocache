name: Server v0.6 Native Journal + NGINX Include (Containers)

on:
  pull_request:
    paths:
      - 'scripts/ci_v06_native_nginx_journal_include_transaction.py'
      - 'tests/test_ci_v06_native_nginx_journal_include_transaction.py'
      - 'docs/testing/SERVER_NATIVE_JOURNAL_INCLUDE_TRANSACTION_CI.md'
      - '.github/workflows/server-v06-native-journal-include.yml'
      - 'src/repocache/server_native_nginx_managed_rehearsal_v1.py'
      - 'src/repocache/server_native_nginx_package_journal_v1.py'
  push:
    branches: [main, 'integration/**']
    paths:
      - 'scripts/ci_v06_native_nginx_journal_include_transaction.py'
      - 'tests/test_ci_v06_native_nginx_journal_include_transaction.py'
      - 'docs/testing/SERVER_NATIVE_JOURNAL_INCLUDE_TRANSACTION_CI.md'
      - '.github/workflows/server-v06-native-journal-include.yml'
      - 'src/repocache/server_native_nginx_managed_rehearsal_v1.py'
      - 'src/repocache/server_native_nginx_package_journal_v1.py'
  merge_group:

permissions:
  contents: read

jobs:
  native-journal-and-include:
    name: Native package journal and managed include (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: debian13
            image: debian:trixie-slim
          - platform: almalinux10
            image: almalinux:10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run native package install and NGINX include restore under one held state lock
        shell: bash
        env:
          DISTRO_IMAGE: ${{ matrix.image }}
        run: |
          set -Eeuo pipefail
          docker run --rm --network bridge \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --workdir /workspace "$DISTRO_IMAGE" sh -ec '
              set -eu
              if command -v apt-get >/dev/null 2>&1; then
                apt-get update -qq
                DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends python3 ca-certificates openssl systemd >/dev/null
              else
                dnf -y -q install python3 ca-certificates openssl systemd >/dev/null
              fi
              export PYTHONPATH=/workspace/src
              export REPOCACHE_NATIVE_TEST_CONTAINER=CONFIRMED_DISPOSABLE_DOCKER_ONLY
              if ! python3 -B scripts/ci_v06_native_nginx_journal_include_transaction.py > /tmp/repocache-journal-include.json; then
                cat /tmp/repocache-journal-include.json
                exit 1
              fi
              cat /tmp/repocache-journal-include.json
              grep -Fq DISPOSABLE_NATIVE_JOURNAL_LOCKED_INCLUDE_RESTORE_PASS /tmp/repocache-journal-include.json
              for flag in real_native_apt_dnf_package_install_in_container durable_pending_package_journal_preserved single_exclusive_state_lock_through_native_and_include_checks real_nginx_parser_accepted_valid_owned_fragment real_nginx_parser_rejected_invalid_owned_fragment previous_owned_include_inode_restored foreign_include_refused_without_change second_native_package_transaction_refused; do
                grep -Fq "\"$flag\":true" /tmp/repocache-journal-include.json
              done
              for flag in host_root_authenticated booted_systemd_tested selinux_enforcing_tested nginx_reload_performed native_package_effects_reconciled authorizes_host_installation; do
                grep -Fq "\"$flag\":false" /tmp/repocache-journal-include.json
              done
              echo "PASS: native installed NGINX and managed include syntax/restoration shared one durable pending lock"
              echo "NOT VERIFIED: booted systemd, SELinux, signed host authority, committed configuration and live reload"
            '
