name: Native Client Fallback Probe

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Disposable development PRs only; keep retries and manual acceptance isolated.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('isolated-{0}-{1}-{2}', github.event_name, github.sha, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  impact:
    uses: ./.github/workflows/supplemental-test-impact.yml

  debian13-apt-metadata:
    needs: impact
    if: ${{ needs.impact.outputs.client == 'true' }}
    name: Signed APT metadata preference/fallback (debian:trixie-slim)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run isolated signed APT metadata probe
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network bridge \
            --env REPOCACHE_DISPOSABLE_NATIVE_CI=1 \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --workdir /workspace debian:trixie-slim \
            sh -ec 'apt-get update -qq && \
                    apt-get install -y --no-install-recommends python3 gnupg openssl >/dev/null && \
                    python3 scripts/ci_client_native_fallback.py apt && \
                    python3 scripts/ci_client_native_fallback.py apt --tls && \
                    python3 scripts/ci_client_native_fallback.py apt --tls --package-transfer && \
                    python3 scripts/ci_compiled_native_fallback.py apt'

  almalinux10-dnf-metadata:
    needs: impact
    if: ${{ needs.impact.outputs.client == 'true' }}
    name: DNF metadata preference/fallback (almalinux:10)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run isolated DNF metadata probe
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network bridge \
            --env REPOCACHE_DISPOSABLE_NATIVE_CI=1 \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --workdir /workspace almalinux:10 \
            sh -ec 'dnf install -y python3 createrepo_c openssl gnupg2 rpm-build rpm-sign >/dev/null && \
                    if command -v dnf5 >/dev/null 2>&1; then \
                      dnf install -y dnf5-plugins >/dev/null; \
                    else \
                      dnf install -y dnf-plugins-core >/dev/null; \
                    fi && \
                    python3 scripts/ci_client_native_fallback.py dnf && \
                    python3 scripts/ci_client_native_fallback.py dnf --tls && \
                    python3 scripts/ci_client_native_fallback.py dnf --tls --signed-dnf && \
                    python3 scripts/ci_compiled_native_fallback.py dnf && \
                    python3 scripts/ci_dnf_signed_rpm_fallback.py'
