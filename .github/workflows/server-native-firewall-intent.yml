name: Native HTTPS firewall opt-in preview (two-distro nonroot)

on:
  pull_request:
    paths:
      - 'src/repocache/server_native_firewall_intent_v1.py'
      - 'tests/test_server_native_firewall_intent_v1.py'
      - 'docs/testing/SERVER_NATIVE_FIREWALL_INTENT_V1.md'
      - '.github/workflows/server-native-firewall-intent.yml'
  merge_group:

permissions:
  contents: read

jobs:
  firewall-intent:
    name: Firewall opt-in pure security tests (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: debian13
            image: debian:trixie-slim
          - platform: almalinux10
            image: almalinux:10
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install distro Python pytest and rootless switch
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ '${{ matrix.platform }}' = debian13 ]; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends python3 python3-pytest util-linux
          else
            dnf -y -q --enablerepo=crb install python3 python3-pytest util-linux
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actual nonroot semantic and hostile-input tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f /.dockerenv
          setpriv --reuid 65534 --regid 65534 --clear-groups \
            env PYTHONPATH="$GITHUB_WORKSPACE/src" PYTHONDONTWRITEBYTECODE=1 \
            python3 -B -m pytest -q -p no:cacheprovider \
              tests/test_server_native_firewall_intent_v1.py
          echo "PASS: firewall intent requires explicit opt-in and never applies policy"
          echo "NOT VERIFIED: host firewall backend, effective privilege, SELinux, rollback"
