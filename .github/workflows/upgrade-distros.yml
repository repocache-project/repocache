name: Debian 13 and AlmaLinux 10 upgrade rehearsal

on:
  # Required on every PR: path-filtered workflows omit mandatory security
  # contexts for tests/docs-only changes and weaken pre-merge acceptance.
  pull_request:
  push:
    branches: [main, 'release/**', 'integration/**']
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  # Only first-attempt PR events supersede earlier PR runs.
  # Re-runs, push, merge_group and dispatch always remain isolated.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('isolated-{0}-{1}-{2}', github.event_name, github.sha, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  isolated-release-upgrade:
    name: Synthetic rootless update and rollback (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:trixie-slim', 'almalinux:10']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Exercise synthetic rootless install and rollback (NOT published v0.3.0 migration)
        shell: bash
        run: bash scripts/smoke_upgrade_distros.sh '${{ matrix.image }}'
