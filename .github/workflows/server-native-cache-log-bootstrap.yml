name: Server Native Cache and Log Storage Bootstrap

on:
  pull_request:
    paths:
      - '.github/workflows/server-native-cache-log-bootstrap.yml'
      - 'src/repocache/server_native_storage_provision_v1.py'
      - 'tests/test_server_native_storage_provision_v1.py'
      - 'docs/testing/SERVER_NATIVE_CACHE_LOG_BOOTSTRAP.md'
  push:
    branches: [main, 'integration/**']
    paths:
      - '.github/workflows/server-native-cache-log-bootstrap.yml'
      - 'src/repocache/server_native_storage_provision_v1.py'
      - 'tests/test_server_native_storage_provision_v1.py'
  merge_group:

permissions:
  contents: read

jobs:
  native-cache-log-bootstrap:
    name: Fixed cache/log provision (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: debian13
            image: debian:trixie-slim
          - platform: almalinux10
            image: almalinux:10
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native Python and pytest in disposable distro image
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ '${{ matrix.platform }}' = 'debian13' ]; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends python3 python3-pytest
          else
            dnf -y -q --enablerepo=crb install python3 python3-pytest
          fi
      - name: Run real filesystem storage tests with supported userspace
        shell: bash
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: |
          set -Eeuo pipefail
          python3 -B - <<'PY'
          import os
          import sys
          from pathlib import Path
          from repocache.server_install_v1 import validate_os_identity
          distro, version = {
              "debian13": ("debian", (3, 13)),
              "almalinux10": ("almalinux", (3, 12)),
          }[os.environ["EXPECTED_PLATFORM"]]
          assert sys.version_info[:2] == version
          assert validate_os_identity(
              Path("/etc/os-release").read_text(encoding="utf-8"),
              sys.version_info[:2],
          ) == distro
          print("PASS: correct supported userspace; isolated fixture writes only")
          PY
          python3 -B -m pytest -q -rs \
            tests/test_server_native_storage_provision_v1.py \
            tests/test_server_cache_pressure_observe_v1.py \
            tests/test_server_protected_namespace_bootstrap_v1.py
