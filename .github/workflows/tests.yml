name: Tests

on:
  push:
    branches: [main, release/v0.4.0, integration/v0.5.0, integration/v0.6.0]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test requirements
        run: python -m pip install -e . pytest
      - name: Run unit and Textual integration tests
        run: python -m pytest -q
      # Required contract gate: any unreviewed public command/alias addition
      # fails the protected Python 3.12/3.13 CI matrix. Future grammar changes
      # require updating the reviewed inventory and the behavioral tests.
      - name: Required CLI Architecture v1 conformance gate (#107)
        run: |
          python -m pytest -q \
            tests/test_cli_interface_contract.py \
            tests/test_cli_error_contract.py \
            tests/test_cli_update_install.py
      # The real pre-signing verifier must reject any rehashed/well-formed
      # wheel that is not byte-for-byte the reviewed first-party source.
      - name: Required pre-signing source/wheel provenance gate (#76)
        run: python -m pytest -q tests/test_presign_v05_source_wheel.py
      # Explicit required step: missing/renamed defensive test modules fail CI
      # rather than becoming an accidentally omitted pytest discovery case.
      - name: Required release security regression gate (issues 37 38 39)
        run: |
          python -m pytest -q \
            tests/test_public_release_transport_defensive.py \
            tests/test_hostile_archive_defensive.py \
            tests/test_complete_bundle_identity.py \
            tests/test_release_integration_contract.py

  release-bundle-smoke:
    name: Bundle integrity and unsigned-source refusal (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ['debian13', 'almalinux10']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Build the exact release asset
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python scripts/build_release.py --tag "$TAG" --output dist
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Verify bundle, reject unsigned source and exercise client in Docker
        shell: bash
        run: bash scripts/smoke_release_bundle.sh "$RELEASE_TAG" '${{ matrix.platform }}' dist
      - name: Rehearse Node.js 24 artifact upload without publishing (#74)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: node24-rehearsal-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # Stable, unfiltered checks live in the already-required Tests workflow.
  # The native reusable workflow is read-only and covers BOTH target distros.
  dependency-native-validation:
    name: Unprivileged native dependency evidence
    if: ${{ (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    uses: ./.github/workflows/native-upstream-wheels.yml
    permissions:
      contents: read

  dependency-native-gate:
    name: Native Dependency Security Gate
    if: ${{ always() }}
    needs: [dependency-native-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      MAIN_TARGET: ${{ (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      UPSTREAM_STATUS: ${{ needs.dependency-native-validation.result }}
    steps:
      - name: Require both native operating-system checks to succeed
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "$MAIN_TARGET" = 'true' ]; then
            if [ "$UPSTREAM_STATUS" != 'success' ]; then
              echo 'FAIL: native dependency evidence missing, skipped or failed' >&2
              exit 1
            fi
            echo 'PASS: both native dependency profiles completed successfully'
          else
            echo 'NOT APPLICABLE: graph gates cover protected main, not legacy release refs'
          fi

  # Read-only producer matrix; never call the write-capable publisher workflow.
  # Always runs on PRs against main, even for docs-only changes.
  dependency-graph-collect:
    name: Gate read-only graph source (${{ matrix.target }})
    if: ${{ (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: debian13-py313
            python: '3.13'
          - target: almalinux10-py312
            python: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Produce exact pinned wheel metadata without executing packages
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/ci_dependency_graph_collect_v05.py \
            --source . --target '${{ matrix.target }}' \
            --sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/dependency-graph-preview-${{ matrix.target }}.json"
      - name: Preserve same-run source-verified snapshot
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gate-graph-${{ matrix.target }}
          path: ${{ runner.temp }}/dependency-graph-preview-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 1

  dependency-graph-gate:
    name: Dependency Graph Security Gate
    if: ${{ always() }}
    needs: [dependency-graph-collect]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MAIN_TARGET: ${{ (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      UPSTREAM_STATUS: ${{ needs.dependency-graph-collect.result }}
    steps:
      - name: Refuse missing, skipped or failed profile collection
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ "$MAIN_TARGET" = 'true' ]; then
            if [ "$UPSTREAM_STATUS" != 'success' ]; then
              echo 'FAIL: one or both graph profiles missing, skipped or failed' >&2
              exit 1
            fi
          else
            echo 'NOT APPLICABLE: graph gates cover protected main, not legacy release refs'
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        if: env.MAIN_TARGET == 'true'
      - name: Fetch both snapshots from this workflow run only
        if: env.MAIN_TARGET == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gate-graph-*
          path: ${{ runner.temp }}/gate-graphs
          merge-multiple: true
      - name: Verify exact source locks, edges and combined manifest
        if: env.MAIN_TARGET == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/ci_dependency_graph_submit_v05.py \
            --source . --directory "$RUNNER_TEMP/gate-graphs" \
            --sha "$GITHUB_SHA"

  # BEGIN TEMPORARY GATE FAILURE PROBE — deliberately red; not for merge
  native-matrix-partial-failure:
    name: Probe native matrix (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: debian13
            image: debian:13-slim
          - target: almalinux10
            image: almalinux:10
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Simulate one failed and one successful native profile
        shell: sh
        run: |
          set -eu
          case '${{ matrix.target }}' in
            debian13) echo 'PROBE: deliberate native matrix failure (expected)'; exit 23 ;;
            almalinux10) echo 'PROBE: native matrix success'; exit 0 ;;
            *) exit 1 ;;
          esac

  native-failure-gate:
    name: Probe final gate after native matrix failure
    if: ${{ always() }}
    needs: [native-matrix-partial-failure]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: debian:13-slim
    env:
      UPSTREAM_STATUS: ${{ needs.native-matrix-partial-failure.result }}
    steps:
      - name: Intentionally fail closed on non-success upstream
        shell: sh
        run: |
          set -eu
          echo "PROBE: native matrix status=$UPSTREAM_STATUS"
          test "$UPSTREAM_STATUS" = failure
          if [ "$UPSTREAM_STATUS" != success ]; then
            echo 'PROBE PASS: native final gate refuses failed prerequisite'
            exit 21
          fi
          echo 'PROBE FAIL: native final gate bypass'
          exit 0

  skipped-prerequisite:
    name: Probe intentionally skipped prerequisite
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'UNEXPECTED: this must not run'

  skipped-prerequisite-gate:
    name: Probe final gate after skipped prerequisite
    if: ${{ always() }}
    needs: [skipped-prerequisite]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: almalinux:10
    env:
      UPSTREAM_STATUS: ${{ needs.skipped-prerequisite.result }}
    steps:
      - name: Intentionally fail closed on skipped upstream
        shell: sh
        run: |
          set -eu
          echo "PROBE: skipped dependency status=$UPSTREAM_STATUS"
          test "$UPSTREAM_STATUS" = skipped
          if [ "$UPSTREAM_STATUS" != success ]; then
            echo 'PROBE PASS: final gate refuses skipped prerequisite'
            exit 22
          fi
          echo 'PROBE FAIL: skipped prerequisite bypass'
          exit 0

  graph-missing-artifacts:
    name: Probe real graph preflight missing artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: python:3.13-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Actual production preflight must fail on empty same-run artifact directory
        shell: sh
        run: |
          set -eu
          mkdir -p /tmp/repocache-gate-probe-empty
          echo 'PROBE: deliberately invoking read-only preflight with missing artifacts'
          python scripts/ci_dependency_graph_submit_v05.py \
            --source . --directory /tmp/repocache-gate-probe-empty \
            --sha "$GITHUB_SHA"
          echo 'PROBE FAIL: preflight unexpectedly accepted missing artifacts'
          exit 0

  graph-preflight-failure-gate:
    name: Probe final graph gate after real preflight failure
    if: ${{ always() }}
    needs: [graph-missing-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: python:3.13-slim
    env:
      UPSTREAM_STATUS: ${{ needs.graph-missing-artifacts.result }}
    steps:
      - name: Intentionally fail closed on rejected graph preflight
        shell: sh
        run: |
          set -eu
          echo "PROBE: actual preflight result=$UPSTREAM_STATUS"
          test "$UPSTREAM_STATUS" = failure
          if [ "$UPSTREAM_STATUS" != success ]; then
            echo 'PROBE PASS: graph gate refuses failed real preflight'
            exit 24
          fi
          echo 'PROBE FAIL: graph preflight failure bypass'
          exit 0
  # END TEMPORARY GATE FAILURE PROBE
