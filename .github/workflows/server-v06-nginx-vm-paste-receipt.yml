name: Server v0.6 NGINX VM Paste Receipt (Native Container Refusal)

on:
  pull_request:
    paths:
      - 'scripts/format_native_nginx_vm_paste_receipt.py'
      - 'tests/test_native_nginx_vm_paste_receipt_v1.py'
      - 'docs/testing/SERVER_NATIVE_NGINX_VM_PASTE_RECEIPT_V1.md'
      - '.github/workflows/server-v06-nginx-vm-paste-receipt.yml'
      - 'src/repocache/server_native_vm_readonly_v1.py'
      - 'scripts/inspect_native_vm_nginx_prerequisites.py'
  push:
    branches: [main, 'integration/**']
    paths:
      - 'scripts/format_native_nginx_vm_paste_receipt.py'
      - 'tests/test_native_nginx_vm_paste_receipt_v1.py'
      - 'docs/testing/SERVER_NATIVE_NGINX_VM_PASTE_RECEIPT_V1.md'
      - '.github/workflows/server-v06-nginx-vm-paste-receipt.yml'
      - 'src/repocache/server_native_vm_readonly_v1.py'
      - 'scripts/inspect_native_vm_nginx_prerequisites.py'
  merge_group:

permissions:
  contents: read

jobs:
  native-vm-paste-refusal:
    name: NGINX VM pasted-readonly evidence (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: debian13
            image: debian:trixie-slim
          - platform: almalinux10
            image: almalinux:10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse simulated native VM success inside a real distro container
        shell: bash
        env:
          DISTRO_IMAGE: ${{ matrix.image }}
        run: |
          set -Eeuo pipefail
          docker run --rm --network bridge \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --workdir /workspace "$DISTRO_IMAGE" sh -ec '
              set -eu
              if command -v apt-get >/dev/null 2>&1; then
                apt-get update -qq
                DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends python3 ca-certificates >/dev/null
              else
                dnf -y -q install python3 ca-certificates >/dev/null
              fi
              export PYTHONPATH=/workspace/src
              set +e
              python3 -B scripts/inspect_native_vm_nginx_prerequisites.py |
                python3 -B scripts/format_native_nginx_vm_paste_receipt.py > /tmp/nginx-vm-paste.txt
              rc=$?
              set -e
              test "$rc" -eq 2
              test "$(wc -l < /tmp/nginx-vm-paste.txt)" -eq 1
              grep -Fq REPOCACHE_NGINX_VM_V1= /tmp/nginx-vm-paste.txt
              grep -Fq "\"code\":\"CONTAINER_CONTEXT_REFUSED\"" /tmp/nginx-vm-paste.txt
              grep -Fq "\"issue_27_acceptance_passed\":false" /tmp/nginx-vm-paste.txt
              grep -Fq "\"authorizes_nginx_reload\":false" /tmp/nginx-vm-paste.txt
              cat /tmp/nginx-vm-paste.txt
              echo "PASS: native container refusal is copy/paste-safe and never asserts installed VM acceptance"
            '
