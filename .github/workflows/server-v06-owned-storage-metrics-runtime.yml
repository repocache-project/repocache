name: Owned cache and private metrics native runtime (disposable)

on:
  pull_request:
    paths:
      - 'scripts/ci_v06_owned_storage_metrics_runtime.py'
      - '.github/workflows/server-v06-owned-storage-metrics-runtime.yml'
      - 'src/repocache/server_native_storage_bootstrap_v1.py'
      - 'src/repocache/server_native_repository_cache_v1.py'
      - 'src/repocache/server_native_metrics_file_bootstrap_v1.py'
      - 'src/repocache/server_nginx_metrics_bundle_join_v1.py'
      - 'src/repocache/server_nginx_repository_bundle_v1.py'
      - 'src/repocache/core.py'
  merge_group:

permissions:
  contents: read

jobs:
  native-owned-runtime:
    name: Managed cache and private metrics (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: debian13
            image: debian:trixie-slim
          - platform: almalinux10
            image: almalinux:10
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native packaged NGINX, OpenSSL and Python
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ '${{ matrix.platform }}' = debian13 ]; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends nginx openssl python3
          else
            dnf -q -y install nginx openssl python3
          fi
      - name: Exercise owned cache, actual worker, private metrics and repeat provisioning
        shell: bash
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
          REPOCACHE_NATIVE_OWNED_RUNTIME_CI: CONFIRMED_DISPOSABLE_DOCKER_ONLY
        run: |
          set -Eeuo pipefail
          python3 -B scripts/ci_v06_owned_storage_metrics_runtime.py | tee "$RUNNER_TEMP/owned-runtime-receipt.txt"
          python3 -I -B - "$RUNNER_TEMP" <<'PY'
          import base64, json, sys
          from pathlib import Path
          work = Path(sys.argv[1])
          prefix = "METRICS_FIXTURE_BASE64:"
          rows = [line[len(prefix):] for line in (work / "owned-runtime-receipt.txt").read_text().splitlines()
                  if line.startswith(prefix)]
          assert len(rows) == 1 and len(rows[0]) < 12000
          raw = base64.b64decode(rows[0], validate=True)
          assert len(raw.splitlines()) == 8
          assert all(json.loads(line)["upstream_cache_status"] in ("MISS", "HIT") for line in raw.splitlines())
          (work / "owned-metrics.jsonl").write_bytes(raw)
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: owned-metrics-${{ matrix.platform }}
          path: ${{ runner.temp }}/owned-metrics.jsonl
          if-no-files-found: error
          retention-days: 1

  actual-cli-reader:
    name: Actual CLI reads both native metrics samples
    runs-on: ubuntu-latest
    needs: native-owned-runtime
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Install normal CI project requirements
        run: python -m pip install -e .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: owned-metrics-*
          path: ${{ runner.temp }}/native-metrics-samples
      - name: Verify actual CLI counts from unmodified native samples
        shell: bash
        run: |
          set -Eeuo pipefail
          for distro in debian13 almalinux10; do
            sample="$RUNNER_TEMP/native-metrics-samples/owned-metrics-$distro/owned-metrics.jsonl"
            test -f "$sample"
            REPOCACHE_METRICS_LOG="$sample" python -m repocache.cli metrics show --period 24h --json > "$RUNNER_TEMP/owned-cli-$distro.json"
            python -I -B - "$sample" "$RUNNER_TEMP/owned-cli-$distro.json" <<'PY'
          import json, sys
          from pathlib import Path
          rows = [json.loads(line) for line in Path(sys.argv[1]).read_bytes().splitlines()]
          report = json.loads(Path(sys.argv[2]).read_text())
          assert report["schema_version"] == 1 and report["ok"] is True and report["available"] is True
          assert report["requests"] == len(rows) == 8
          assert report["hit"] == sum(row["upstream_cache_status"] == "HIT" for row in rows) == 4
          assert report["miss"] == sum(row["upstream_cache_status"] == "MISS" for row in rows) == 4
          assert report["cache_observed"] == 8
          assert report["bytes_sent"] == sum(int(row["body_bytes_sent"]) for row in rows)
          print("PASS: real CLI reads exact native NGINX fixture metrics without fabricated values")
          PY
          done
