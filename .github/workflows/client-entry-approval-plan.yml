name: Client Entry Approval Plan Native

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Disposable development PRs only; keep retries and manual acceptance isolated.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('isolated-{0}-{1}-{2}', github.event_name, github.sha, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  impact:
    uses: ./.github/workflows/supplemental-test-impact.yml

  entry-approval:
    needs: impact
    if: ${{ needs.impact.outputs.client == 'true' }}
    name: Explicit root approval and byte-only preview (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:trixie-slim', 'almalinux:10']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Use the checked-out PR-head transaction staging already in main.
      # An old pinned checkout would hide integration regressions.
      - name: Test guarded approval and sibling preservation with native Python
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network bridge \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --workdir /workspace '${{ matrix.image }}' \
            sh -ec '
              if command -v apt-get >/dev/null 2>&1; then
                apt-get update -qq
                apt-get install -y --no-install-recommends python3 >/dev/null
              else
                # Python comes from the standard AlmaLinux base repositories.
                # The optional extras mirror has returned malformed metadata;
                # do not let it block this disposable source-approval test.
                # Never turn off RPM signature or TLS verification.
                dnf --disablerepo=extras install -y python3 >/dev/null
              fi
              python3 scripts/smoke_client_entry_approval_plan.py
              python3 scripts/smoke_client_entry_stage.py
            '
