name: Server v0.6 Pinned Native TLS Pair

on:
  pull_request:
    paths:
      - "src/repocache/server_native_tls_material_probe_v1.py"
      - "tests/test_server_native_tls_material_probe_v1.py"
      - ".github/workflows/server-native-tls-material.yml"
  merge_group:

permissions:
  contents: read

jobs:
  native-tls-pair:
    name: FD-pinned OpenSSL native (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: debian13
            image: debian:trixie-slim
          - platform: almalinux10
            image: almalinux:10
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native system OpenSSL and Python pytest
        shell: bash
        run: |
          set -Eeuo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends python3 python3-pytest openssl
          else
            dnf -y -q --enablerepo=crb install python3 python3-pytest openssl
          fi
      - name: Execute actual pinned file/cryptographic pair tests
        shell: bash
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -Eeuo pipefail
          python3 -B -m pytest -q -rs tests/test_server_native_tls_material_probe_v1.py
          echo "PASS: private fixture FD-pinned OpenSSL cert/key and negatives"
