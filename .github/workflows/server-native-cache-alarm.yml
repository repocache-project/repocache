name: Server v0.6 Native Cache Alarm Transitions

on:
  pull_request:
    paths:
      - "src/repocache/server_cache_pressure_alarm_v1.py"
      - "tests/test_server_cache_pressure_alarm_v1.py"
      - ".github/workflows/server-native-cache-alarm.yml"
  merge_group:

permissions:
  contents: read

jobs:
  native-pressure-alarm:
    name: Native Linux pressure event tests (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: debian13
            image: debian:trixie-slim
          - platform: almalinux10
            image: almalinux:10
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install distro Python and pytest
        shell: bash
        run: |
          set -Eeuo pipefail
          if command -v apt-get >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends python3 python3-pytest
          else
            dnf -y -q --enablerepo=crb install python3 python3-pytest
          fi
      - name: Observe true Linux statvfs and exercise alarm hysteresis
        shell: bash
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -Eeuo pipefail
          python3 -B -m pytest -q -rs \
            tests/test_server_cache_pressure_alarm_v1.py \
            tests/test_server_cache_pressure_observe_v1.py \
            tests/test_server_cache_pressure_policy_v1.py
          echo "PASS: non-activating native pressure alarm and statvfs tests"
