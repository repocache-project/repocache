name: v0.6 Native NGINX TLS Rotation and Recovery

on:
  pull_request:
    paths:
      - scripts/ci_v06_nginx_tls_rotation_recovery.py
      - tests/test_server_native_tls_rotation_workflow_v1.py
      - docs/testing/SERVER_NATIVE_TLS_ROTATION_RECOVERY.md
      - .github/workflows/server-native-tls-rotation-recovery.yml
  merge_group:

permissions:
  contents: read

jobs:
  tls-rotation:
    name: Native NGINX TLS rotate-recover (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: debian13
            image: debian:trixie-slim
          - platform: almalinux10
            image: almalinux:10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build disposable distro TLS test image
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$RUNNER_TEMP/Dockerfile.tlsrotate" <<'EOF'
          ARG BASE_IMAGE
          FROM $BASE_IMAGE
          RUN if command -v apt-get >/dev/null; then \
                apt-get update -qq && DEBIAN_FRONTEND=noninteractive \
                apt-get install -y -qq nginx python3 openssl ca-certificates; \
              else dnf -y -q install nginx python3 openssl ca-certificates; fi
          EOF
          docker build --pull -f "$RUNNER_TEMP/Dockerfile.tlsrotate" \
            --build-arg BASE_IMAGE=${{ matrix.image }} \
            -t "repocache-tls-rotate:${{ matrix.platform }}" "$RUNNER_TEMP"
      - name: Prove TLS rotation and rollback on actual stock NGINX
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network none --read-only --user 65534:65534 \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=128m,mode=1777 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/repo,readonly" \
            -e REPOCACHE_DISPOSABLE_TLS_ROTATION=1 \
            "repocache-tls-rotate:${{ matrix.platform }}" \
            python3 -B /repo/scripts/ci_v06_nginx_tls_rotation_recovery.py
