name: Server v2 retirement and cache retention across process restart

on:
  pull_request:
    paths:
      - 'tests/test_server_v2_repository_cache_retention_v1.py'
      - '.github/workflows/server-v2-repository-cache-retention.yml'
      - 'docs/testing/SERVER_V2_REPOSITORY_CACHE_RETENTION_V1.md'
  merge_group:

permissions:
  contents: read

jobs:
  retired-id-native-fixture:
    name: Retired ID/cache fixture through fresh process ({{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: debian13
            image: debian:trixie-slim
          - platform: almalinux10
            image: almalinux:10
    container:
      image: {{ matrix.image }}
    steps:
      - name: Install native Python/pytest from selected distro
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ '{{ matrix.platform }}' = 'debian13' ]; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends python3 python3-pytest
          else
            dnf -y -q --enablerepo=crb install python3 python3-pytest
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify state-v2 ID retirement and owned disk cache after new process
        shell: bash
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -Eeuo pipefail
          test -f /.dockerenv
          python3 -m pytest -q tests/test_server_v2_repository_cache_retention_v1.py
