name: Server v0.6 Native NGINX Process Refusal (Containers)

on:
  pull_request:
    paths:
      - 'src/repocache/server_native_nginx_ownership_v1.py'
      - 'tests/test_server_native_nginx_ownership_v1.py'
      - 'scripts/ci_v06_native_nginx_process_footprint.py'
      - 'docs/testing/SERVER_NATIVE_NGINX_PROCESS_CONFLICT_V1.md'
      - '.github/workflows/server-v06-nginx-process-refusal.yml'
  push:
    branches: [main, 'integration/**']
    paths:
      - 'src/repocache/server_native_nginx_ownership_v1.py'
      - 'tests/test_server_native_nginx_ownership_v1.py'
      - 'scripts/ci_v06_native_nginx_process_footprint.py'
      - 'docs/testing/SERVER_NATIVE_NGINX_PROCESS_CONFLICT_V1.md'
      - '.github/workflows/server-v06-nginx-process-refusal.yml'
  merge_group:

permissions:
  contents: read

jobs:
  native-process-refusal:
    name: Native NGINX process-only conflict (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: debian13
            image: debian:trixie-slim
          - platform: almalinux10
            image: almalinux:10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prove a real running NGINX blocks fresh APT/DNF preparation
        shell: bash
        env:
          DISTRO_IMAGE: ${{ matrix.image }}
        run: |
          set -Eeuo pipefail
          docker run --rm --network bridge \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --workdir /workspace "$DISTRO_IMAGE" sh -ec '
              set -eu
              if command -v apt-get >/dev/null 2>&1; then
                apt-get update -qq
                DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends python3 nginx ca-certificates >/dev/null
              else
                dnf -y -q install python3 nginx ca-certificates >/dev/null
              fi
              export PYTHONPATH=/workspace/src
              export REPOCACHE_NATIVE_TEST_CONTAINER=CONFIRMED_DISPOSABLE_DOCKER_ONLY
              python3 -B scripts/ci_v06_native_nginx_process_footprint.py > /tmp/repocache-process-refusal.json || {
                cat /tmp/repocache-process-refusal.json
                exit 1
              }
              grep -Fq CI_REAL_NGINX_PROCESS_CONFLICT_REFUSED /tmp/repocache-process-refusal.json
              cat /tmp/repocache-process-refusal.json
              echo "PASS: real running native NGINX refused before metadata despite simulated absent file markers"
              echo "NOT VERIFIED: installed booted systemd/SELinux, authorized root transaction and full idempotence"
            '
