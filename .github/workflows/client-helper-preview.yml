name: Client Helper Preview Native

on:
  pull_request:
    paths-ignore:
      - '*.md'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-helper:
    name: Read-only helper scope + real UID denial (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:trixie-slim', 'almalinux:10']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Execute isolated read-only prototype with OS Python
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network bridge \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --workdir /workspace '${{ matrix.image }}' \
            sh -ec '
              if command -v apt-get >/dev/null 2>&1; then
                apt-get update -qq
                apt-get install -y --no-install-recommends python3 >/dev/null
              else
                dnf install -y python3 >/dev/null
              fi
              python3 scripts/smoke_client_helper_preview.py
              # Execute genuine kernel locks under root only inside this
              # disposable Debian/Alma container. The bind-mounted source
              # tree remains read-only; the smoke creates only /tmp fixtures.
              PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/smoke_client_native_held_package_locks.py
              if command -v apt-get >/dev/null 2>&1; then
                python3 scripts/smoke_client_root_source_boundary.py apt
                python3 scripts/smoke_client_recoverable_pair.py apt
              else
                python3 scripts/smoke_client_root_source_boundary.py dnf
                python3 scripts/smoke_client_recoverable_pair.py dnf
              fi
            '
