name: Client Helper Preview Native

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Disposable development PRs only; keep retries and manual acceptance isolated.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('isolated-{0}-{1}-{2}', github.event_name, github.sha, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  impact:
    uses: ./.github/workflows/supplemental-test-impact.yml

  read-only-helper:
    needs: impact
    if: ${{ needs.impact.outputs.client != 'false' }}
    name: Read-only helper scope + real UID denial (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:trixie-slim', 'almalinux:10']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Execute isolated read-only prototype with OS Python
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network bridge \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --workdir /workspace '${{ matrix.image }}' \
            sh -ec '
              if command -v apt-get >/dev/null 2>&1; then
                apt-get update -qq
                apt-get install -y --no-install-recommends python3 python3-pytest >/dev/null
              else
                dnf install -y python3 python3-pytest >/dev/null
              fi
              # Required scoped root-only registry regression: the ordinary
              # unprivileged Python matrix deliberately skips these cases.
              # Execute on the existing disposable root container, not a host.
              PYTHONDONTWRITEBYTECODE=1 python3 -B -m pytest -q -rs -p no:cacheprovider \
                tests/test_client_root_source_boundary.py \
                -k "registry_directory_metadata_matches_bootstrap or registry_directory_identity_rechecked_after_operation"
              # The authenticated recovery decoder has root-only tests.
              # Execute every case here, not just in the unprivileged matrix.
              test "$(id -u)" = 0 && test "$(id -g)" = 0
              PYTHONDONTWRITEBYTECODE=1 python3 -B -m pytest -q -rs -p no:cacheprovider \
                tests/test_client_recovery_journal_v1.py
              python3 scripts/smoke_client_helper_preview.py
              # Execute genuine kernel locks under root only inside this
              # disposable Debian/Alma container. The bind-mounted source
              # tree remains read-only; the smoke creates only /tmp fixtures.
              PYTHONDONTWRITEBYTECODE=1 python3 -B scripts/smoke_client_native_held_package_locks.py
              if command -v apt-get >/dev/null 2>&1; then
                python3 scripts/smoke_client_root_source_boundary.py apt
                python3 scripts/smoke_client_recoverable_pair.py apt
              else
                python3 scripts/smoke_client_root_source_boundary.py dnf
                python3 scripts/smoke_client_recoverable_pair.py dnf
              fi
            '
