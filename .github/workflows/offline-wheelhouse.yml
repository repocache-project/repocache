name: Offline wheelchain validation

on:
  pull_request:
  push:
    branches: [main, 'release/**', 'integration/**']
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  # Only first-attempt PR events supersede earlier PR runs.
  # Re-runs, push, merge_group and dispatch always remain isolated.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('isolated-{0}-{1}-{2}', github.event_name, github.sha, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  native-offline-wheels:
    name: Offline wheels (${{ matrix.os }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: ['debian:trixie-slim', 'almalinux:10']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build as nonroot, verify in networkless container
        run: bash scripts/smoke_offline_wheels.sh '${{ matrix.os }}'

  signed-publisher-rehearsal:
    name: Signed release and native offline dependency artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build exact source release archive (no tag or publication)
        run: python3 scripts/build_release.py --output dist
      - name: Build pinned wheels and install with network disabled on both Linux platforms
        run: bash scripts/build_release_wheels.sh dist
      - name: Verify ephemeral publisher signature, SBOM and tampered wheel rejection
        run: python3 scripts/rehearse_signed_publisher.py dist
