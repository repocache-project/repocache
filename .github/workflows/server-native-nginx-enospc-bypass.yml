name: Native NGINX bounded ENOSPC bypass and recovery

on:
  pull_request:
    paths:
      - 'scripts/ci_server_nginx_enospc_bypass_native.py'
      - '.github/workflows/server-native-nginx-enospc-bypass.yml'
      - 'docs/testing/SERVER_NATIVE_ENOSPC_BYPASS_V1.md'
  merge_group:

permissions:
  contents: read

jobs:
  native-enospc:
    name: Bounded native NGINX ENOSPC recovery (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: debian13
            image: debian:trixie-slim
          - platform: almalinux10
            image: almalinux:10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Observe real ENOSPC only inside a 4 MiB disposable Docker tmpfs
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm --network bridge \
            --tmpfs /repocache-ci-enospc:rw,nosuid,nodev,size=4m,mode=1777 \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --workdir /workspace '${{ matrix.image }}' \
            sh -ec '
              if command -v apt-get >/dev/null 2>&1; then
                export DEBIAN_FRONTEND=noninteractive
                apt-get update -qq
                apt-get install -y -qq --no-install-recommends \
                  nginx python3 openssl ca-certificates util-linux
              else
                dnf -y -q --enablerepo=crb install \
                  nginx python3 openssl ca-certificates util-linux
              fi
              test -f /.dockerenv
              setpriv --reuid 65534 --regid 65534 --clear-groups \
                env PYTHONDONTWRITEBYTECODE=1 \
                  PYTHONPATH=/workspace/src:/workspace/scripts \
                  REPOCACHE_DISPOSABLE_ENOSPC_TEST=1 \
                python3 -B scripts/ci_server_nginx_enospc_bypass_native.py
            '
