name: Native metrics private inode bootstrap (detached distro fixtures)

on:
  pull_request:
    paths:
      - 'src/repocache/server_native_metrics_file_bootstrap_v1.py'
      - 'tests/test_server_native_metrics_file_bootstrap_v1.py'
      - 'docs/testing/SERVER_NATIVE_METRICS_FILE_BOOTSTRAP_V1.md'
      - '.github/workflows/server-native-metrics-file-bootstrap.yml'
  merge_group:

permissions:
  contents: read

jobs:
  metrics-private-file:
    name: Private metrics inode bootstrap (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: debian13
            image: debian:trixie-slim
          - platform: almalinux10
            image: almalinux:10
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install distro Python and pytest
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ '${{ matrix.platform }}' = debian13 ]; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends python3 python3-pytest
          else
            dnf -y -q --enablerepo=crb install python3 python3-pytest
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run real inode, crash and foreign-file refusal tests
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONPATH=src PYTHONDONTWRITEBYTECODE=1 python3 -B -m pytest \
            -q -p no:cacheprovider tests/test_server_native_metrics_file_bootstrap_v1.py
          echo 'PASS: fixture-owned NGINX metrics log created 0600 and retained'
          echo 'NOT VERIFIED: host install, real UID mapping, systemd, SELinux'
