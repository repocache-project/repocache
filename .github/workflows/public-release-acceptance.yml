name: Public release acceptance

on:
  # Historical v0.4.0 artifact verification only, via explicit dispatch.
  workflow_dispatch:
    inputs:
      tag:
        description: Reviewed, immutable release target
        type: choice
        required: true
        default: v0.4.0
        options:
          - v0.4.0

permissions:
  contents: read

concurrency:
  group: public-release-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-distribution:
    name: Anonymous real release and publisher signatures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch exact immutable public bytes without credentials
        env:
          RELEASE_TAG: ${{ inputs.tag || 'v0.4.0' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/repocache-release"
          python3 scripts/public_release_acceptance.py fetch \
            --tag "$RELEASE_TAG" --dest "$RUNNER_TEMP/repocache-release"
          printf 'PASS: actual anonymous public release authenticated\n'

# Historical v0.4.0 native outcomes remain archived in issue #71.
# Its immutable binary cannot follow the transferred GitHub API redirect.
# A new v0.6.0 candidate clean-install matrix supersedes this obsolete smoke.
