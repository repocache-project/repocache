name: Server Managed HTTPS TLS Smoke (Distro Containers)

on:
  pull_request:
    paths:
      - '.github/workflows/server-native-https-tls-smoke.yml'
      - 'tests/test_server_https_tls_native_v1.py'
      - 'docs/testing/SERVER_MANAGED_TLS_NATIVE_SMOKE.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/server-native-https-tls-smoke.yml'
      - 'tests/test_server_https_tls_native_v1.py'

permissions:
  contents: read

jobs:
  disposable-tls:
    name: Real NGINX HTTPS and operator TLS refusal (${{ matrix.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: debian13
            image: debian:trixie-slim
          - platform: almalinux10
            image: almalinux:10
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stock distribution NGINX and synthetic-key tools
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ '${{ matrix.platform }}' = 'debian13' ]; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends \
              python3 python3-pytest nginx openssl ca-certificates
          else
            dnf -y -q --enablerepo=crb install \
              python3 python3-pytest nginx openssl ca-certificates
          fi
          python3 --version
          nginx -v
          openssl version
      - name: Exercise real isolated TLS + mismatched/invalid operator key refusal
        shell: bash
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -Eeuo pipefail
          python3 -B -m pytest -q -rs \
            tests/test_server_https_tls_native_v1.py
          # Each daemon binds a private Unix SSL listener under pytest tmp;
          # no host port, systemd, firewall, SELinux, production TLS files,
          # privilege helper or real REPOCACHE activation is used here.
