# Authenticated bootstrap only. Never include the vendor's nginx.conf.
# The fixed local endpoint has no repository routes, TLS or external listener.
# Full managed TLS/route activation remains a separate guarded transaction.
pid /run/repocache-nginx.pid;
worker_processes 1;
events {
    worker_connections 128;
}
http {
    server {
        listen 127.0.0.1:8080;
        server_name localhost;
        location = /__repocache/private {
            return 204;
        }
        location / {
            return 404;
        }
    }
}
